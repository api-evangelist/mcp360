      summary: Execute search_news
      operationId: yahoo-search_search_news
      tags:
      - yahoo-search
      parameters:
      - name: validateOutput
        in: query
        schema:
          type: boolean
        description: Validate output against schema
      - name: strictValidation
        in: query
        schema:
