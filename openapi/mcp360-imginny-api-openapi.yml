openapi: 3.2.0
info:
  title: AI Image Generation REST Imginny API
  version: 1.0.0
  description: AI-powered image generation and editing using Google Imagen. Create stunning images from text descriptions, upscale existing images, and more.
servers:
- url: https://connect.mcp360.ai
  description: MCP360 API Server
security:
- bearerAuth: []
- apiKey: []
tags:
- name: imginny
paths:
  /api/v1/imginny/generate_image_fast:
    post:
      summary: Execute generate_image_fast
      operationId: imginny_generate_image_fast
      tags:
      - imginny
      parameters:
      - name: validateOutput
        in: query
        schema:
          type: boolean
        description: Validate output against schema
      - name: strictValidation
        in: query
        schema:
          type: boolean
        description: Fail on validation errors
      - name: includeMetadata
        in: query
        schema:
          type: boolean
        description: Include execution metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/imginny_generate_image_fast_input'
      responses:
        '200':
          description: Successful execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  metadata:
                    type: object
                    properties:
                      service:
                        type: string
                      tool:
                        type: string
                      executionTime:
                        type: string
                      creditsUsed:
                        type: number
                      timestamp:
                        type: string
                        format: date-time
                required:
                - success
                - data
        '400':
          description: Bad request or validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (premium access required)
        '404':
          description: Service or tool not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
    get:
      summary: Execute generate_image_fast
      operationId: imginny_generate_image_fast_get
      tags:
      - imginny
      parameters:
      - name: prompt
        in: query
        required: true
        schema:
          type: string
        description: Text description of the image you want to generate
      - name: aspectRatio
        in: query
        required: false
        schema:
          type: string
        description: 'Image aspect ratio (default: 1:1)'
      - name: numberOfImages
        in: query
        required: false
        schema:
          type: number
        description: 'Number of images to generate (1-4, default: 1)'
      - name: negativePrompt
        in: query
        required: false
        schema:
          type: string
        description: Things to avoid in the generated image (optional)
      - name: personGeneration
        in: query
        required: false
        schema:
          type: string
        description: 'Control person generation in images (default: allow_adult)'
      - name: validateOutput
        in: query
        schema:
          type: boolean
        description: Validate output against schema
      - name: includeMetadata
        in: query
        schema:
          type: boolean
        description: Include execution metadata
      responses:
        '200':
          description: Successful execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  metadata:
                    type: object
                    properties:
                      service:
                        type: string
                      tool:
                        type: string
                      executionTime:
                        type: string
                      creditsUsed:
                        type: number
                      timestamp:
                        type: string
                        format: date-time
                required:
                - success
                - data
        '400':
          description: Bad request or validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (premium access required)
        '404':
          description: Service or tool not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
