components:
  schemas:
    dns-lookup_lookup_mx_input:
      type: object
      properties:
        domain:
          type: string
          minLength: 3
          maxLength: 253
          pattern: ^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$
          description: Domain name to lookup MX records (e.g., example.com)
      required:
      - domain
      additionalProperties: false
    dns-lookup_lookup_dns_input:
      type: object
      properties:
        domain:
          type: string
          minLength: 3
          maxLength: 253
          pattern: ^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$
          description: Domain name to lookup DNS records (e.g., example.com)
      required:
      - domain
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
