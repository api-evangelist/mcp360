openapi: 3.2.0
info:
  title: Tools REST Google Maps API
  version: 1.0.0
  description: Google Maps place search, business details, reviews, and local discovery
servers:
- url: https://connect.mcp360.ai
  description: MCP360 API Server
security:
- bearerAuth: []
- apiKey: []
tags:
- name: google-maps
