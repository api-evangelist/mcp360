      summary: Execute search_places
      operationId: google-maps_search_places_get
      tags:
      - google-maps
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: Search query (e.g., 'coffee shops', 'italian restaurants')
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: Location (e.g., 'New York, NY', 'London')
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Place type (e.g., 'restaurant', 'hotel', 'cafe')
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: Country code (e.g., 'us', 'uk')
      - name: language
        in: query
        required: false
        schema:
          type: string
        description: Language code (e.g., 'en', 'es')
      - name: validateOutput
        in: query
        schema:
