components:
  schemas:
    google-maps_search_nearby_input:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude coordinate
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude coordinate
        type:
          type: string
          minLength: 1
          maxLength: 50
          description: Place type (e.g., 'restaurant', 'gas_station', 'atm')
        radius:
          type: integer
          minimum: 1
          maximum: 50000
          default: 1000
          description: 'Search radius in meters (default: 1000)'
        language:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[a-z]{2}$
          description: Language code (e.g., 'en', 'es')
      required:
      - latitude
      - longitude
      - type
      additionalProperties: false
    google-maps_get_place_details_input:
      type: object
      properties:
        place_id:
          type: string
          minLength: 1
          maxLength: 500
          description: Google Maps place ID
        language:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[a-z]{2}$
          description: Language code (e.g., 'en', 'es')
      required:
      - place_id
      additionalProperties: false
    google-maps_get_reviews_input:
      type: object
      properties:
        place_name:
          type: string
          description: Name of the place or business
        location:
          type: string
          description: Location (e.g., 'New York, NY')
        language:
          type: string
          description: Language code (e.g., 'en', 'es')
      required:
      - place_name
      additionalProperties: false
    google-maps_search_places_input:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
          description: Search query (e.g., 'coffee shops', 'italian restaurants')
        location:
          type: string
          minLength: 1
          maxLength: 200
          description: Location (e.g., 'New York, NY', 'London')
        type:
          type: string
          minLength: 1
          maxLength: 50
          description: Place type (e.g., 'restaurant', 'hotel', 'cafe')
        country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[a-z]{2}$
          description: Country code (e.g., 'us', 'uk')
        language:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[a-z]{2}$
          description: Language code (e.g., 'en', 'es')
      required:
      - query
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
