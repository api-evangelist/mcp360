generated: '2026-08-09'
method: derived
source: openapi/*.json 4xx/5xx responses + live probes of https://connect.mcp360.ai
format: bespoke-json
envelope:
  fields:
  - error
  - message
  - hint
  content_type: application/json
  rfc9457: false
  note: MCP360 does not emit application/problem+json. Every generated OpenAPI declares 400/401/500 with
    a description but no response schema, so the shapes below were captured by probing the live gateway.
problems:
- status: 400
  error: Bad request or validation error
  title: Request body failed inputSchema validation
  source: openapi/*.json (declared on all 178 operations)
  schema_declared: false
  remediation: Validate the request body against the tool inputSchema in json-schema/mcp360-tool-schemas.json;
    schemas are additionalProperties:false so unknown keys are rejected.
- status: 401
  error: Authentication failed
  title: Missing credentials
  message: Missing authorization header or api_key parameter
  hint: Provide Authorization header with Bearer token or X-API-Key header
  observed: POST /api/v1/weather/get_current_weather with no credentials
  probed: '2026-08-09'
  remediation: 'Send X-API-Key or Authorization: Bearer with a key from https://dashboard.mcp360.ai.'
- status: 401
  error: Authentication failed
  title: Invalid, inactive or banned key
  message: Invalid, inactive, or banned API key
  observed: POST /api/v1/weather/get_current_weather with a bogus X-API-Key
  probed: '2026-08-09'
  remediation: Regenerate the key in the dashboard; the same status and error string is reused for missing
    and invalid credentials, so clients cannot distinguish them without reading message.
- status: 404
  error: Service not found
  title: Unknown service slug
  fields:
  - service
  - availableServices
  - hint
  observed: GET /api/v1/no-such-service
  probed: '2026-08-09'
  remediation: The 404 body enumerates every valid service slug — use it as a live service catalogue.
- status: 404
  error: Not found
  title: Unknown gateway path
  fields:
  - error
  - availableEndpoints
  observed: GET https://connect.mcp360.ai/nope
  probed: '2026-08-09'
  remediation: The 404 body enumerates every mounted MCP endpoint.
- status: 500
  error: Failed to generate OpenAPI spec
  title: OpenAPI generation failure
  message: Service '<slug>' not found
  observed: GET /api/v1/openapi.json (slug parsed as a service name)
  probed: '2026-08-09'
  remediation: Request the spec at /api/v1/{service}/openapi.json; a bad slug surfaces as a 500 rather
    than a 404 — a defect worth reporting to the provider.
- status: 500
  error: Internal server error
  title: Tool execution failure
  source: openapi/*.json (declared on all 178 operations)
  schema_declared: false
gaps:
- No error-code registry is published.
- 400/401/500 are declared in the specs with no response schema.
- Missing and invalid credentials share one status and one error string.
