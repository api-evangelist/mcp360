  note: MCP360 publishes no changelog, release notes or version history for the hosted gateway — neither
    for the REST API at connect.mcp360.ai/api/v1 nor for the MCP surface. /changelog 404s, the sitemap
    lists eleven pages and none is a changelog, and every one of the 38 generated OpenAPI documents carries
