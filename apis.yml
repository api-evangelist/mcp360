apis:
- name: MCP360 Gateway
  description: 'Unified gateway exposing 38 tool services as both hosted remote MCP servers and a REST API. GET
    /api/v1/{service} returns the service tool registry with full input and output JSON Schemas (no auth required);
    GET /api/v1/{service}/openapi.json returns a generated OpenAPI 3.0.0 document; POST /api/v1/{service}/{tool}
    executes a tool. Authentication is X-API-Key or Authorization: Bearer for REST, and OAuth 2.1 or ?token= for
    the MCP transport.'
  humanURL: https://mcp360.ai/docs
  baseURL: https://connect.mcp360.ai/api/v1
